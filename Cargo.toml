[package]
name = "handl-plugin-sdkgen-emitter-python"
version = "0.1.0"
edition = "2024"
description = "Python `ctypes` emitter for the Handl SDK generator (ADR-0107)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/sdkgen-python"

[dependencies]
# ADR-0128 Phase 1: the sdkgen port stays in platform; this repo is the
# python target. The workspace-root `[patch]` resolves the git dep from
# the sibling `../platform` checkout for local development.
handl-plugin-sdkgen = { git = "https://github.com/handl-lang/platform", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }

[patch."https://github.com/handl-lang/kernel"]
handl-language = { path = "../kernel/crates/handl-language" }
handl-value = { path = "../kernel/crates/handl-value" }

[patch."https://github.com/handl-lang/platform"]
handl-plugin-sdkgen = { path = "../platform/crates/plugin-sdkgen" }
