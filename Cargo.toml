[package]
name = "handl-plugin-sdkgen-emitter-python"
version = "0.1.0"
edition = "2024"
description = "Python `ctypes` emitter for the Handl SDK generator (ADR-0107)."
license = "MIT"
repository = "https://github.com/handl-lang/engine-sdkgen-python"
readme = "README.md"
keywords = ["handl", "sdkgen", "python", "bindings"]
categories = ["development-tools"]

[dependencies]
# ADR-0128 Phase 1: the sdkgen port stays in platform; this repo is the
# python target. The workspace-root `[patch]` resolves the git dep from
# the sibling `../host` checkout for local development.
handl-plugin-sdkgen = { git = "https://github.com/handl-lang/host", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }

[patch."https://github.com/handl-lang/kernel"]
handl-calculus = { path = "../kernel/crates/handl-calculus" }
handl-language = { path = "../kernel/crates/handl-language" }
handl-value = { path = "../kernel/crates/handl-value" }

[patch."https://github.com/handl-lang/host"]
handl-plugin-sdkgen = { path = "../host/crates/plugin-sdkgen" }
